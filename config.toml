# Configurazione dello studio.
#
# Tutto ciò che è una scelta — metodologica o operativa — sta qui e non nel codice.
# Il criterio: se cambiando questo file e rieseguendo la catena si ottiene un'analisi
# diversa e coerente, senza aprire un solo .py, il file sta facendo il suo lavoro.
#
# Le scelte metodologiche che stanno qui sono le stesse congelate in docs/definizioni.md.
# Se le cambi, aggiorna anche quel file e il suo registro delle modifiche: è lì che si
# dichiara *quando* una definizione è stata decisa, che è ciò che tiene onesto lo studio.

[studio]
# Sesso su cui gira l'analisi. Il femminile è costruito ma non studiato: copertura dal
# 2011, nessuna categoria Under 23, numerosità un ordine di grandezza inferiore.
# Vedi docs/da_fare.md §A4bis prima di metterlo a "F".
sesso = "M"

[stagioni]
# Ultima stagione conclusa. La 2026 era in corso al momento dell'estrazione dei dati.
# Portandola a 2026, dopo aver riscaricato, l'analisi si replica senza altre modifiche.
massima = 2025

# Stagioni con copertura anomala. Non vengono escluse: ricevono un flag in tab_a e la
# decisione se tenerle resta all'analisi. Il 2020 ha metà dei classificati abituali in
# tutte le categorie, e chi ha fatto punti li ha fatti su molte meno occasioni.
[stagioni.anomale]
2020 = "covid"

[fonte]
# Da dove vengono i dati di partenza. Sta in configurazione e non nel testo perche' il
# documento dichiara la propria provenienza, e quella provenienza cambia quando si
# rigenera il database a monte.
repository = "https://github.com/lucabnt/risultati-ciclismo-giovanile"
estrazione = "2026-08-10"   # data dell'estrazione da cui deriva il database in uso
schema = "2.1"              # schema del database a monte; la 2.2 porta la nascita alla fonte
portale = "ciclismo.info"

[coorti]
# Coorti diverse per domande diverse: gli esiti hanno abbondanza molto diversa.
# 78 eventi PRO contro 8 in top 100 sulle stesse coorti.
domanda_a_c = [1996, 2000]   # diventare professionista, e da che età il risultato informa
domanda_b   = [1992, 2000]   # qualità della carriera
# La sopravvivenza a tempo discreto usa coorti piu' ampie, con censura: chi non ha
# ancora finito la finestra dei 25 anni contribuisce comunque gli anni gia' osservati.
# Il limite inferiore non e' negoziabile: la classifica Under 15 esiste dal 2009, quindi
# prima della coorte 1996 le prime stagioni non sono assenze ma dati mancanti, e le due
# cose in un modello di sopravvivenza non si possono confondere.
domanda_sopravvivenza = [1996, 2008]

[esiti]
# Classi di squadra che contano come professionista: prima e seconda divisione UCI.
# I nomi sono cambiati nel tempo e PCS usa quello vigente in quella stagione.
#   WT  WorldTeam, prima divisione dal 2011
#   PT  ProTeam dell'era UCI ProTour, prima divisione, visto 2005-2008
#   PCT Professional Continental, seconda divisione, visto 2005-2019
#   PRT UCI ProTeam, è il PCT rinominato nel 2020
classi_pro = ["WT", "PT", "PCT", "PRT"]

eta_minima_pro = 19        # nessuno puo' correre da professionista prima: e' una regola
                           # UCI, non un dato osservato, e infatti nei dati il primo
                           # passaggio avviene esattamente a 19 anni. Il modello di
                           # sopravvivenza parte da qui: includere eta' in cui l'evento
                           # e' impossibile non aggiunge informazione e destabilizza la
                           # stima dell'andamento per eta'.
eta_massima_pro = 25       # finestra per l'esito PRO
eta_massima_qualita = 26   # finestra per il tier: la più ampia osservabile per la coorte 2000

# Soglie del tier, dalla più stringente. Il top 500 non è arbitrario: è una fascia
# ufficiale di PCS, che usa gli scaglioni 10/25/50/100/200/500/1000.
soglie_tier = [[100, 3], [500, 2]]

[predittore]
# pct_rank_ext = percentile su punti, poi vittorie, poi piazzamenti dal 2° al 5°.
# L'ordinamento per soli punti lascerebbe il 92% degli atleti a pari merito.
principale = "pct_rank_ext"
sensibilita = ["pct_rank", "z_log_pts", "top10", "top25pct"]

[contesto]
# Sotto questa numerosità il tasso di professionisti di una società non è una stima.
min_coorti_precedenti = 5

[scaricamento]
# Pause fra le richieste. Non scendere sotto il secondo: sono siti piccoli.
pausa_schede = 1.2
pausa_pcs = 2.5
stagioni_pro = [2011, 2026]      # rose WorldTeam e ProTeam
stagioni_ranking = [2007, 2025]  # classifiche annuali
profondita_ranking = 500         # deve coprire la soglia più larga di soglie_tier

[modelli]
# Celle mostrate nella matrice di correlazione: descrittiva, calcolata a coppie.
celle_correlazione = ["U15y1", "U15y2", "U17y1", "U17y2", "U19y1", "U19y2", "U23y1"]

# Celle su cui si calcola il VIF. Qui serve un campione con TUTTE le celle osservate
# sullo stesso atleta, e il campione crolla in fretta: su tutte e dieci le celle restano
# poche decine di atleti. Si dichiara quindi il sottoinsieme, e il risultato riporta
# sempre il proprio n accanto.
celle_vif = ["U15y1", "U15y2", "U17y1", "U17y2", "U19y1", "U19y2"]

# Celle della sequenza annidata (STEP 18): una per categoria, non due. Il sottocampione
# di chi e' osservato in TUTTE le celle e' di poco piu' di cento atleti: con una regola
# prudente di dieci eventi per variabile, quattro predittori sono il massimo che quel
# campione sostiene. Si prende l'ultimo anno di ciascuna categoria, che e' l'osservazione
# piu' vicina al passaggio successivo.
celle_annidate = ["U15y2", "U17y2", "U19y2", "U23y1"]

# Variante armonizzata del predittore U19 (Problema 4 della guida): stessa sequenza, ma
# con l'U19 misurato includendo i risultati internazionali da PCS. Finche' la colonna non
# esiste in tab_b, lo STEP 18 gira solo nella versione grezza e lo dichiara.
cella_u19_armonizzata = "U19_arm"

[report]
# Ordine delle sezioni nel documento generato. L'ordine sta qui e non nei nomi dei file:
# riorganizzare il documento, o dividerlo in piu' post, non comporta rinominare moduli.
# Ogni voce e' un modulo in report/moduli/ con una funzione calcola() e una rendi().
sezioni = [
  "sintesi",
  "provenienza",
  "misura",
  "attrito",
  "copertura",
  "passaggi",
  "punteggi",
  "rae",
  "correlazioni",
  "contesto",
  "univariati",
  "annidati",
  "metriche",
  "sopravvivenza",
  "traiettorie",
  "qualita",
  "validazione",
]

[etica]
# Nessuna cella con meno di questo numero di atleti nelle tabelle pubblicate.
# I dati riguardano minorenni: il vincolo va imposto dal codice, non ricordato.
min_cella_pubblicabile = 5
